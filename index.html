<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow — Precision Task Management, Kanban &amp; Focus Timer</title>
    <meta
      name="description"
      content="Organize daily tasks, projects, Kanban boards, calendar schedules, and Pomodoro focus sessions in one calm, offline-first workspace."
    />
    <meta name="theme-color" content="#FAF9F6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E0F12" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TaskFlow — Precision Task Management &amp; Deep Focus" />
    <meta
      property="og:description"
      content="Natural-language quick capture, List, Kanban, Calendar views, and built-in Pomodoro focus sessions synced in real time."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TaskFlow — Precision Task Management &amp; Deep Focus" />
    <meta
      name="twitter:description"
      content="Natural-language quick capture, List, Kanban, Calendar views, and built-in Pomodoro focus sessions synced in real time."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      ;(function () {
        try {
          var mode = localStorage.getItem('theme') || 'system'
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
